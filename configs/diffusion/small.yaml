inherits: ../base.yaml
variant: diffusion
device: mps
model:
  arch: lgt            # lgt | dit | transformer
  attn_type: bidirectional
  attn_impl: gqa
  n_kv_heads: 2
  ffn_type: geglu
  use_time_cond: true
  max_length: 128
train:
  epochs: 2000
  steps: null
  batch_size: 24
  lr: 0.0003
eval:
  every_n_epochs: 10
viz:
  every_n_steps: 500
